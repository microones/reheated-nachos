# Postgres local per a desenvolupament. Arrenca'l amb: docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nachos
      POSTGRES_PASSWORD: nachos
      POSTGRES_DB: reheated_nachos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
